<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #050509; font-family: "Segoe UI", system-ui, sans-serif; }
    a { color: #9fe9f1; } a:hover { color: #7cf7ff; }
  </style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; background: #050509; padding: 16px 18px; display: flex;">
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid #272739;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 0;">
      <div style="display: flex; align-items: center; gap: 7px; color: #7cf7ff; font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-size: 11px;">
        <svg width="11" height="12" viewBox="0 0 11 12" fill="none"><path d="M5.5 0.8 10 3.4v5.2L5.5 11.2 1 8.6V3.4z" stroke="#7cf7ff" stroke-width="1"></path></svg>
        <span>journal-clip &nbsp;/&nbsp; {{faceName}}</span>
      </div>
      <button onClick="{{flip}}" style="background: #101018; color: #a7a7bd; border: 1px solid #272739; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 4px 10px; cursor: pointer;">flip</button>
    </div>

    <div style="flex: 1; min-height: 0; padding: 12px 14px; display: flex;">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; transform: scaleX({{scale}}); transform-origin: 50% 50%;">

        <sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px;">

          <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">the row, as you build it</div>

          <div style="border: 1px solid #28A2B2; background: #0a0a10; padding: 13px 14px; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 13px; line-height: 1.7;">
            <span style="color: #6c6c83;">alarm add</span>
            <sc-for list="{{parts}}" as="p" hint-placeholder-count="4">
            <span style="color: #6c6c83;"> {{p.flag}} </span><span style="color: {{p.tone}};">{{p.val}}</span>
            </sc-for><span style="color: #7cf7ff;">&#9646;</span>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
            <button onClick="{{c.pick}}" style="background: {{c.bg}}; color: {{c.fg}}; border: 1px solid {{c.line}}; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 5px 9px; cursor: pointer;">{{c.key}}</button>
            </sc-for>
          </div>

          <div style="border-top: 1px solid #272739; padding-top: 12px; display: flex; flex-direction: column; gap: 6px;">
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">{{focus.key}} &#183; {{focus.hint}}</div>
            <input value="{{focus.val}}" style="width: 100%; box-sizing: border-box; background: #0a0a10; color: #f4f4fb; border: 1px solid #272739; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 16px; padding: 10px 12px; outline: none;">
            <div style="display: flex; gap: 6px;">
              <sc-for list="{{focus.presets}}" as="s" hint-placeholder-count="3">
              <span style="border: 1px solid #272739; color: #a7a7bd; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 3px 8px;">{{s}}</span>
              </sc-for>
            </div>
          </div>

          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <div style="color: #e2a24a; font-size: 12px;">every is not part of create &#183; interval it after</div>
            <button style="background: #101018; color: #7cf7ff; border: 1px solid #7cf7ff; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 15px; font-weight: 700; padding: 10px; cursor: pointer;">add</button>
          </div>

        </div>
        </sc-if>

        <sc-if value="{{back}}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px;">

          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
            <div style="color: #7cf7ff; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 26px; line-height: 1;">02:14:07</div>
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">until <span style="color: #a7a7bd;">wake journal</span></div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">seven days &#183; every armed fire</div>
            <svg width="454" height="196" viewBox="0 0 454 196" style="display: block; background: #0a0a10; border: 1px solid #272739;">
              <sc-for list="{{hourLabels}}" as="h" hint-placeholder-count="5">
              <text x="{{h.x}}" y="12" fill="#6c6c83" font-family="Consolas, monospace" font-size="8" text-anchor="middle">{{h.label}}</text>
              </sc-for>
              <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <text x="6" y="{{d.ty}}" fill="#6c6c83" font-family="Consolas, monospace" font-size="9">{{d.name}}</text>
              </sc-for>
              <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <line x1="34" y1="{{d.ly}}" x2="446" y2="{{d.ly}}" stroke="#17172a" stroke-width="1"></line>
              </sc-for>
              <sc-for list="{{marks}}" as="m" hint-placeholder-count="26">
              <rect x="{{m.x}}" y="{{m.y}}" width="4" height="14" fill="{{m.fill}}"></rect>
              </sc-for>
              <line x1="{{nowX}}" y1="18" x2="{{nowX}}" y2="190" stroke="#e2a24a" stroke-width="1"></line>
            </svg>
          </div>

          <div style="display: flex; flex-direction: column; gap: 1px; background: #272739; border-top: 1px solid #272739; border-bottom: 1px solid #272739;">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; align-items: center; background: #050509; padding: 9px 2px;">
              <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">{{r.key}}</span>
              <span style="color: {{r.tone}}; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.val}}</span>
            </div>
            </sc-for>
          </div>

          <div style="margin-top: auto;">
            <button style="background: #101018; color: #e2a24a; border: 1px solid #e2a24a; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 15px; font-weight: 700; padding: 10px; cursor: pointer; width: 100%;">stop daemon</button>
          </div>

        </div>
        </sc-if>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"startFace":{"editor":"enum","options":["front","back"],"default":"front"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { back: false, scale: 1, touched: false, focus: 'when' };
    this._busy = false;
    this._step = 0;
    this.flip = this.flip.bind(this);
    this.tick = this.tick.bind(this);
  }
  shown() {
    if (this.state.touched) return this.state.back;
    return (this.props.startFace ?? 'front') === 'back';
  }
  scaleAt(step, steps) {
    const half = steps >> 1;
    if (step <= 0 || step >= steps) return 1;
    if (step < half) return Math.max(0.02, 1 - step / half);
    if (step === half) return 0.02;
    return Math.max(0.02, (step - half) / half);
  }
  flip() {
    if (this._busy) return;
    this._busy = true;
    this._step = 0;
    this.tick();
  }
  tick() {
    const steps = 8;
    const s = this._step;
    if (s === (steps >> 1)) this.setState({ back: !this.shown(), touched: true });
    this.setState({ scale: this.scaleAt(s, steps) });
    if (s >= steps) { this._busy = false; this.setState({ scale: 1 }); return; }
    this._step = s + 1;
    setTimeout(this.tick, 16);
  }
  renderVals() {
    const back = this.shown();
    const spec = [
      { key: 'id', flag: '--id', val: 'morning', hint: 'slug handle, unique', presets: ['morning', 'stretch', 'wind-down'] },
      { key: 'title', flag: '--title', val: 'wake journal', hint: 'human line on the cue', quote: true, presets: [] },
      { key: 'when', flag: '--when', val: '07:00', hint: 'clock · +offset · RFC3339', presets: ['07:00', '+25m', '2026-09-01T06:30:00Z'] },
      { key: 'do', flag: '--do', val: 'hop', hint: 'hop (default) · cue · none', presets: ['hop', 'cue', 'none'] },
      { key: 'note', flag: '--note', val: '', hint: 'search haystack, optional', presets: [] }
    ];
    const focusKey = this.state.focus;
    const chips = spec.map((f) => {
      const on = f.key === focusKey;
      return {
        key: f.key,
        bg: on ? '#17172a' : '#101018',
        fg: on ? '#7cf7ff' : '#6c6c83',
        line: on ? '#7cf7ff' : '#272739',
        pick: () => this.setState({ focus: f.key })
      };
    });
    const focus = spec.find((f) => f.key === focusKey) || spec[0];
    const cellW = 412 / 24;
    const hourLabels = [0, 6, 12, 18, 24].map((h) => ({ x: 34 + h * cellW, label: String(h) }));
    const dayNames = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const days = dayNames.map((n, i) => ({ name: n, ty: 34 + i * 24, ly: 40 + i * 24 }));
    const fires = [7, 12.5, 18, 22.25];
    const marks = [];
    dayNames.forEach((n, i) => {
      fires.forEach((h, j) => {
        if (i > 4 && j === 1) return;
        marks.push({ x: 34 + h * cellW, y: 24 + i * 24, fill: j === 1 ? '#28A2B2' : '#7cf7ff' });
      });
    });
    return {
      back: back,
      front: !back,
      scale: this.state.scale,
      flip: this.flip,
      faceName: back ? 'circadia · daemon' : 'circadia · create',
      // quoting happens here, never in the value bound into an attribute
      parts: spec.filter((f) => f.val !== '').map((f) => ({
        flag: f.flag,
        val: f.quote ? '"' + f.val + '"' : f.val,
        tone: f.key === focusKey ? '#7cf7ff' : '#e7e7f2'
      })),
      chips: chips,
      focus: focus,
      hourLabels: hourLabels,
      days: days,
      marks: marks,
      nowX: 34 + 4.77 * cellW,
      rows: [
        { key: 'running', val: 'yes · pid 21884', tone: '#4CAE7C' },
        { key: 'last', val: '04:15:00 · stretch · hop', tone: '#a7a7bd' },
        { key: 'armed', val: '4 of 6 · 2 paused', tone: '#a7a7bd' },
        { key: 'store', val: '~\\.sesefus\\clip-alarms.jsonl', tone: '#6c6c83' }
      ]
    };
  }
}
</script>
</body>
</html>
