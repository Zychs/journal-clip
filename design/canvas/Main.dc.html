<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #050509; font-family: "Segoe UI", system-ui, sans-serif; }
    a { color: #9fe9f1; } a:hover { color: #7cf7ff; }
  </style>
</helmet>
<div style="width: 520px; height: 680px; box-sizing: border-box; background: #050509; padding: 16px 18px; display: flex;">
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid #272739;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 0;">
      <div style="display: flex; align-items: center; gap: 7px; color: #7cf7ff; font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-size: 11px;">
        <svg width="11" height="12" viewBox="0 0 11 12" fill="none"><path d="M5.5 0.8 10 3.4v5.2L5.5 11.2 1 8.6V3.4z" stroke="#7cf7ff" stroke-width="1"></path></svg>
        <span>journal-clip &nbsp;/&nbsp; {{faceName}}</span>
      </div>
      <button onClick="{{flip}}" style="background: #101018; color: #a7a7bd; border: 1px solid #272739; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 4px 10px; cursor: pointer;">flip</button>
    </div>

    <div style="flex: 1; min-height: 0; padding: 12px 14px; display: flex;">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; transform: scaleX({{scale}}); transform-origin: 50% 50%;">

        <sc-if value="{{front}}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px;">

          <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center;">
            <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">id</span>
            <div style="border: 1px solid #272739; background: #101018; color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 13px; padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{slug}}</div>
          </div>

          <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center;">
            <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">title</span>
            <input value="{{title}}" onInput="{{setTitle}}" style="width: 100%; box-sizing: border-box; border: 1px solid #272739; background: #0a0a10; color: #f4f4fb; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; padding: 7px 10px; outline: none;">
          </div>

          <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center;">
            <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">when</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <sc-for list="{{clock}}" as="c" hint-placeholder-count="2">
              <div style="display: flex; align-items: stretch; border: 1px solid #272739; background: #0a0a10;">
                <span style="color: #f4f4fb; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 20px; padding: 4px 10px 5px; min-width: 34px; text-align: center;">{{c.text}}</span>
                <span style="display: flex; flex-direction: column; border-left: 1px solid #272739;">
                  <button onClick="{{c.up}}" style="flex: 1; border: 0; background: #101018; padding: 0 6px; cursor: pointer; line-height: 0;">
                    <svg width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 4.8 4.5 1.3 8 4.8" stroke="#7cf7ff" stroke-width="1.2"></path></svg>
                  </button>
                  <button onClick="{{c.down}}" style="flex: 1; border: 0; border-top: 1px solid #272739; background: #101018; padding: 0 6px; cursor: pointer; line-height: 0;">
                    <svg width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 1.2 4.5 4.7 8 1.2" stroke="#7cf7ff" stroke-width="1.2"></path></svg>
                  </button>
                </span>
              </div>
              <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 16px;">{{c.sep}}</span>
              </sc-for>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 8px 10px; align-items: center;">
            <span style="grid-row: 1; color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">note</span>
            <input style="grid-row: 1; width: 100%; box-sizing: border-box; border: 1px solid #272739; background: #0a0a10; color: #f4f4fb; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; padding: 7px 10px; outline: none;">
            <span style="grid-row: 2; color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">every</span>
            <input style="grid-row: 2; width: 100%; box-sizing: border-box; border: 1px solid #272739; background: #0a0a10; color: #f4f4fb; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; padding: 7px 10px; outline: none;">
            <button onClick="{{cycleDo}}" style="grid-row: 1 / span 2; grid-column: 3; background: #101018; color: {{doTone}}; border: 1px solid {{doTone}}; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 15px; font-weight: 700; padding: 0 16px; cursor: pointer; align-self: stretch;">{{doValue}}</button>
          </div>

          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button style="background: #101018; color: #7cf7ff; border: 1px solid #7cf7ff; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 15px; font-weight: 700; padding: 10px; cursor: pointer;">add</button>
            <button style="background: #101018; color: #a7a7bd; border: 1px solid #272739; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 6px 10px; cursor: pointer;">interval last id</button>
          </div>

        </div>
        </sc-if>

        <sc-if value="{{back}}" hint-placeholder-val="{{ true }}">
        <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px;">

          <div style="display: flex; flex-direction: column; gap: 7px;">
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">fires in</div>
            <div style="border: 1px solid #28A2B2; background: #0a0a10; padding: 14px 16px 12px;">
              <div style="color: #7cf7ff; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 40px; line-height: 1;">02:14:07</div>
              <div style="margin-top: 8px; color: #e7e7f2; font-size: 13px;">wake journal</div>
              <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">morning &#183; 07:00 &#183; every 1d &#183; hop</div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">next 24h</div>
            <svg width="454" height="44" viewBox="0 0 454 44" style="display: block; background: #0a0a10; border: 1px solid #272739;">
              <sc-for list="{{ticks}}" as="t" hint-placeholder-count="9">
              <line x1="{{t.x}}" y1="30" x2="{{t.x}}" y2="36" stroke="#272739" stroke-width="1"></line>
              </sc-for>
              <sc-for list="{{ticks}}" as="t" hint-placeholder-count="9">
              <text x="{{t.x}}" y="42" fill="#6c6c83" font-family="Consolas, monospace" font-size="8" text-anchor="middle">{{t.label}}</text>
              </sc-for>
              <sc-for list="{{armed}}" as="a" hint-placeholder-count="4">
              <line x1="{{a.x}}" y1="8" x2="{{a.x}}" y2="28" stroke="#7cf7ff" stroke-width="2"></line>
              </sc-for>
              <line x1="{{nowX}}" y1="4" x2="{{nowX}}" y2="30" stroke="#e2a24a" stroke-width="1"></line>
              <circle cx="{{nowX}}" cy="4" r="2.5" fill="#e2a24a"></circle>
            </svg>
          </div>

          <div style="display: flex; flex-direction: column; gap: 1px; background: #272739; border-top: 1px solid #272739; border-bottom: 1px solid #272739;">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; align-items: center; background: #050509; padding: 9px 2px;">
              <span style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">{{r.key}}</span>
              <span style="color: {{r.tone}}; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{r.val}}</span>
            </div>
            </sc-for>
          </div>

          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
            <button style="background: #101018; color: #e2a24a; border: 1px solid #e2a24a; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 15px; font-weight: 700; padding: 10px; cursor: pointer;">stop daemon</button>
            <div style="color: #6c6c83; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 11px;">file + process, no port &#183; overdue fires on wake</div>
          </div>

        </div>
        </sc-if>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"startFace":{"editor":"enum","options":["front","back"],"default":"front"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { back: false, scale: 1, touched: false, title: 'wake journal', hh: 7, mm: 0, doAt: 0 };
    this._busy = false;
    this._step = 0;
    this.flip = this.flip.bind(this);
    this.tick = this.tick.bind(this);
    this.setTitle = this.setTitle.bind(this);
    this.cycleDo = this.cycleDo.bind(this);
  }
  setTitle(e) {
    this.setState({ title: e && e.target ? e.target.value : '' });
  }
  cycleDo() {
    this.setState({ doAt: (this.state.doAt + 1) % 3 });
  }
  slugify(text) {
    let s = String(text || '').trim().toLowerCase().replace(/[^a-z0-9._-]+/g, '-');
    s = s.replace(/-{2,}/g, '-').replace(/^[-._]+|[-._]+$/g, '');
    while (s && !/[a-z0-9]/.test(s[0])) s = s.slice(1);
    return s.slice(0, 32);
  }
  bump(unit, by) {
    const hi = unit === 'hh' ? 24 : 60;
    const next = ((this.state[unit] + by) % hi + hi) % hi;
    this.setState({ [unit]: next });
  }
  shown() {
    if (this.state.touched) return this.state.back;
    return (this.props.startFace ?? 'front') === 'back';
  }
  scaleAt(step, steps) {
    const half = steps >> 1;
    if (step <= 0 || step >= steps) return 1;
    if (step < half) return Math.max(0.02, 1 - step / half);
    if (step === half) return 0.02;
    return Math.max(0.02, (step - half) / half);
  }
  flip() {
    if (this._busy) return;
    this._busy = true;
    this._step = 0;
    this.tick();
  }
  tick() {
    const steps = 8;
    const s = this._step;
    if (s === (steps >> 1)) this.setState({ back: !this.shown(), touched: true });
    this.setState({ scale: this.scaleAt(s, steps) });
    if (s >= steps) { this._busy = false; this.setState({ scale: 1 }); return; }
    this._step = s + 1;
    setTimeout(this.tick, 16);
  }
  renderVals() {
    const back = this.shown();
    const pad = (n) => String(n).padStart(2, '0');
    const doOrder = ['hop', 'cue', 'none'];
    const doTones = ['#7cf7ff', '#e7e7f2', '#6c6c83'];
    // inset so the 0 and 24 ticks and their centred labels stay inside the box
    const at = (h) => Math.round((10 + (h / 24) * 434) * 100) / 100;
    const ticks = [];
    for (let h = 0; h <= 24; h += 3) {
      ticks.push({ x: at(h), label: h === 24 ? '24' : String(h) });
    }
    return {
      back: back,
      front: !back,
      scale: this.state.scale,
      flip: this.flip,
      faceName: back ? 'circadia · daemon' : 'circadia · create',
      title: this.state.title,
      slug: this.slugify(this.state.title),
      setTitle: this.setTitle,
      clock: [
        {
          text: pad(this.state.hh),
          sep: ':',
          up: () => this.bump('hh', 1),
          down: () => this.bump('hh', -1)
        },
        {
          text: pad(this.state.mm),
          sep: '',
          up: () => this.bump('mm', 1),
          down: () => this.bump('mm', -1)
        }
      ],
      doValue: doOrder[this.state.doAt],
      doTone: doTones[this.state.doAt],
      cycleDo: this.cycleDo,
      ticks: ticks,
      armed: [{ x: at(7) }, { x: at(12.5) }, { x: at(18) }, { x: at(22.25) }],
      nowX: at(4.77),
      rows: [
        { key: 'running', val: 'yes · pid 21884', tone: '#4CAE7C' },
        { key: 'last', val: '04:15:00 · stretch · hop', tone: '#a7a7bd' },
        { key: 'armed', val: '4 of 6 · 2 paused', tone: '#a7a7bd' },
        { key: 'store', val: '~\\.sesefus\\clip-alarms.jsonl', tone: '#6c6c83' }
      ]
    };
  }
}
</script>
</body>
</html>
